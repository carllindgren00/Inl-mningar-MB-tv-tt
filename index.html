nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:10px 6px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button[aria-current="true"]{border-bottom-color:var(--tag);color:var(--tag)}
nav .count{font-family:var(--mono);font-size:12px;background:var(--tag-soft);color:var(--tag-ink);border-radius:99px;padding:1px 7px;margin-left:4px}
h2{font-family:var(--display);font-size:22px;font-weight:800;margin:22px 0 12px;text-wrap:balance}
.label{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{display:flex;flex-direction:column;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
input[type="date"]{display:block;min-height:48px;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.stack{display:flex;flex-direction:column;gap:14px}
input,textarea{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;font:500 17px var(--body);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--tag);outline-offset:1px}
input.nr{font-family:var(--mono);font-size:26px;letter-spacing:.06em;text-align:right;color:var(--tag-ink);background:var(--tag-soft);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:700 13px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;border-radius:8px;cursor:pointer}
.chip:active{background:var(--tag-soft)}
.items{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) 84px auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{min-height:40px;padding:8px;font-size:16px}
@media (min-width:700px){.chip{font-size:15px;padding:14px 18px}.list{display:grid;grid-template-columns:1fr 1fr}.stub .who{font-size:18px}.panel{border-radius:18px;margin-bottom:24px}.sheet{align-items:center}}
.item .price{text-align:right;font-family:var(--mono)}
.qty{display:flex;align-items:center;gap:2px}
.qty button,.x{width:32px;height:32px;border:0;border-radius:8px;background:var(--bg);color:var(--fg);font:700 17px var(--body);cursor:pointer}
.qty span{font-family:var(--mono);min-width:22px;text-align:center}
.empty{padding:18px;color:var(--muted);text-align:center;font-size:15px}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 4px 0;font-weight:700}
.sum b{font-family:var(--mono);font-size:26px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:12px;font:800 17px var(--body);text-decoration:none;cursor:pointer;padding:12px 16px;text-align:center}
.btn.primary{background:var(--tag);color:var(--on-tag)}
.btn.ok{background:var(--ok);color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn.small{min-height:42px;font-size:15px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}
.row>*{flex:1}
.search{margin:16px 0 4px}
.list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.stub{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 12px;background:var(--surface);border:1.5px solid var(--line);border-left:8px solid var(--tag);border-radius:10px;padding:12px 14px;cursor:pointer;text-align:left;color:var(--fg);font:inherit;width:100%}
.stub.klar{border-left-color:var(--ok)}
.stub.hamtad{border-left-color:var(--line);opacity:.8}
.stub .who{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.stub .no{font-family:var(--mono);font-weight:600;font-size:20px;color:var(--tag);letter-spacing:.06em}
.stub.klar .no{color:var(--ok)}
.stub .what{grid-column:1/-1;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.stub .meta{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted)}
.stub .meta b{font-family:var(--mono);color:var(--fg);font-size:15px}
.pill{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:99px}
.pill.inne{background:var(--tag-soft);color:var(--tag-ink)}
.pill.klar{background:var(--ok-soft);color:var(--ok)}
.pill.hamtad{background:var(--bg);color:var(--muted)}
.pill.late{background:var(--warn-soft);color:var(--warn)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;margin-top:12px}
.linkbtn{border:0;background:none;color:inherit;font:inherit;font-weight:800;text-decoration:underline;padding:0;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;max-width:calc(100% - 32px)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(6,16,30,.5);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.tagcard{background:var(--tag);color:var(--on-tag);border-radius:12px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.tagcard .no{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:.08em}
.tagcard .who{font-weight:800;font-size:19px;overflow-wrap:anywhere;min-width:0}
.tagcard .sub{grid-column:1/-1;font-size:14px;font-weight:500}
.lines{margin:12px 0;border-top:1px dashed var(--line)}
.lines div{display:flex;justify-content:space-between;gap:12px;padding:8px 2px;border-bottom:1px dashed var(--line);font-size:15px}
.lines span:last-child{font-family:var(--mono)}
.msg{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;white-space:pre-wrap;color:var(--fg)}
.hint{font-size:13px;color:var(--muted);margin:6px 2px 0}
.kassa{text-align:center;padding:10px 0}
.kassa .big{font-family:var(--mono);font-size:64px;font-weight:600;letter-spacing:.06em;color:var(--tag);line-height:1}
.kassa .amt{font-family:var(--mono);font-size:44px;font-weight:600;margin:10px 0 4px}
.confirm{background:var(--warn-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px;color:var(--warn);font-weight:600}
.checks{display:flex;gap:10px}
.checks label{flex:1;display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font-weight:700;cursor:pointer}
.checks input{width:22px;height:22px;min-height:0;padding:0;accent-color:var(--tag);-webkit-appearance:checkbox;appearance:auto;flex:none}
.prices{display:flex;flex-direction:column;gap:6px}
.prices label{display:grid;grid-template-columns:1fr 110px;align-items:center;gap:10px;font-weight:700;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.prices input{text-align:right;font-family:var(--mono);min-height:42px;padding:8px}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1>MB:s Tvätt &amp; Kem</h1></div>
    <nav id="nav"></nav>
  </header>
  <p id="net" class="notice" hidden></p>
  <main id="main"></main>
</div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
const GARMENTS=["Blus","Byxor","Tröja","Skjorta","Slips","Klänning","Rock","Kappa","Jacka","Kavaj","Kostym","Dräkt","Gardin","Matta","Duk","Vittvätt"];
const SHOP={name:"MB:s Tvätt & Kem",addr:"Stockholmsvägen 14D, Perstorp",tel:"073-154 02 90"};
const S={orders:[],settings:{next:1,prices:{}},view:"ny",q:"",open:null,mode:"detail",confirmDel:false,dbReady:false,local:false};
let db=null;
const draftEmpty=()=>({nr:"",name:"",phone:"",items:[],inDate:today(),readyDate:addDays(3),note:"",paket:false,galge:false});
let draft=draftEmpty();

function today(){return iso(new Date())}
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function sv(dstr){if(!dstr)return"";const[y,m,d]=dstr.split("-");return (+d)+"/"+(+m)}
function kr(n){return (Math.round((+n||0)*100)/100).toLocaleString("sv-SE")+" kr"}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function total(items){return items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0)}
function itemsText(items){return items.map(i=>(i.qty>1?i.qty+" st ":"")+i.type).join(", ")}
function normPhone(p){let s=String(p||"").replace(/[^\d+]/g,"");if(s.startsWith("00"))s="+"+s.slice(2);else if(s.startsWith("0"))s="+46"+s.slice(1);return s}
function nicePhone(p){return String(p||"")}
function smsHref(phone,body){return "sms:"+normPhone(phone)+"?&body="+encodeURIComponent(body)}
function msgIn(o){return `Hej ${o.name.split(" ")[0]}! Tack för din inlämning hos ${SHOP.name}.\nKvitto nr ${o.nr}: ${itemsText(o.items)}.\nSumma: ${kr(total(o.items))}.\nInlämnat ${sv(o.inDate)}`+(o.readyDate?`, beräknas klart ${sv(o.readyDate)}`:"")+`. Vi skickar ett SMS när det är klart att hämta.`}
function msgReady(o){return `Hej ${o.name.split(" ")[0]}! Din inlämning nr ${o.nr} (${itemsText(o.items)}) är klar att hämta hos ${SHOP.name}, ${SHOP.addr}.\nAtt betala: ${kr(total(o.items))}. Välkommen!`}
function copyText(t,ok){try{navigator.clipboard.writeText(t).then(()=>toast(ok)).catch(()=>toast("Kunde inte kopiera – markera texten och kopiera"))}catch(e){toast("Kunde inte kopiera – markera texten och kopiera")}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2600)}

/* ---------- storage: this device (localStorage) ---------- */
const LS="mbtvatt-v1";
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){S.orders=j.orders||[];S.settings=Object.assign({next:1,prices:{}},j.settings||{})}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({orders:S.orders,settings:S.settings,savedAt:Date.now()}));return true}catch(e){toast("Kunde inte spara i enheten!");return false}}
function setNet(){const el=document.getElementById("net");if(!el)return;
  const days=S.settings.lastBackup?Math.floor((Date.now()-S.settings.lastBackup)/864e5):null;
  if(S.orders.length>=5&&(days===null||days>=7)){el.innerHTML=`Ingen säkerhetskopia på ${days===null?"länge":days+" dagar"}. <button class="linkbtn" id="backup2">Spara kopia nu</button>`;el.hidden=false}
  else el.hidden=true}
async function saveOrder(o){
  o.updatedAt=Date.now();
  const i=S.orders.findIndex(x=>x.id===o.id); if(i>=0)S.orders[i]=o; else S.orders.push(o);
  lsSave(); render();
}
async function deleteOrder(id){S.orders=S.orders.filter(x=>x.id!==id);lsSave();render()}
async function saveSettings(){lsSave()}
async function initDb(){
  lsLoad(); S.local=false; S.dbReady=true; render();
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist() }catch(e){}
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(()=>{}) }
}
/* ---------- backup & restore ---------- */
function csvCell(v){v=String(v??"");return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function giveFile(name,text,type){
  const blob=new Blob([text],{type});
  try{ const f=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true} }catch(e){ if(e&&e.name==="AbortError")return false }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true;
}
async function backup(){
  const ok=await giveFile(`MB-arkiv-${today()}.json`,JSON.stringify({app:"mb-tvatt",version:1,exportedAt:new Date().toISOString(),orders:S.orders,settings:S.settings},null,1),"application/json");
  if(ok){S.settings.lastBackup=Date.now();lsSave();setNet();toast("Säkerhetskopian sparad")}
}
async function exportCsv(){
  const rows=[["Kvittonr","Namn","Mobil","Plagg","Summa kr","Status","Inlämnat","Leverans","Paket","Galge","Betalt med","Anteckning"]];
  [...S.orders].sort((a,b)=>+a.nr-+b.nr).forEach(o=>rows.push([o.nr,o.name,o.phone,o.items.map(i=>`${i.qty} ${i.type} á ${i.price}`).join(", "),total(o.items),{inne:"Inne",klar:"Klar att hämta",hamtad:"Hämtad"}[o.status],o.inDate,o.readyDate,o.paket?"Ja":"",o.galge?"Ja":"",o.paidWith||"",o.note||""]));
  await giveFile(`MB-lista-${today()}.csv`,"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"),"text/csv");
}
function parseCsv(t){t=t.replace(/^﻿/,"");const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c=='"')q=true; else if(c==';'){row.push(cell);cell=""} else if(c=='\n'){row.push(cell);rows.push(row);row=[];cell=""} else if(c!='\r')cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)} return rows}
function ordersFromCsv(t){const rows=parseCsv(t);const h=rows.shift()||[];if(h[0]!=="Kvittonr")throw new Error("fel format");
  const st={"Inne":"inne","Klar att hämta":"klar","Hämtad":"hamtad"};
  return rows.filter(r=>r[0]).map(r=>({id:r[0],nr:r[0],name:r[1],phone:r[2],
    items:(r[3]||"").split(", ").filter(Boolean).map(x=>{const m=x.match(/^(\d+) (.+?) á ([\d.]+)$/);return m?{qty:+m[1],type:m[2],price:+m[3]}:{qty:1,type:x,price:0}}),
    status:st[r[5]]||"inne",inDate:r[6],readyDate:r[7],paket:r[8]==="Ja",galge:r[9]==="Ja",paidWith:r[10]||undefined,note:r[11]||"",createdAt:Date.now(),updatedAt:Date.now()}))}
async function restoreFile(file){
  try{const t=await file.text();let list,settings=null;
    if(/^\s*\{/.test(t)){const j=JSON.parse(t);list=j.orders||[];settings=j.settings||null}else list=ordersFromCsv(t);
    const map=new Map(S.orders.map(o=>[o.id,o]));let added=0;
    list.forEach(o=>{const cur=map.get(o.id);if(!cur||(o.updatedAt||0)>(cur.updatedAt||0)){map.set(o.id,o);added++}});
    S.orders=[...map.values()];
    if(settings){S.settings.prices=Object.assign({},settings.prices||{},S.settings.prices);S.settings.next=Math.max(S.settings.next||1,settings.next||1)}
    lsSave();render();toast(`${added} inlämningar inlästa`);
  }catch(e){toast("Filen kunde inte läsas. Välj en MB-arkiv-fil.")}
}
function fillNr(){const el=document.getElementById("f-nr");if(el&&!el.value){el.placeholder=String(suggestNr())}}
function suggestNr(){const max=S.orders.reduce((m,o)=>Math.max(m,+o.nr||0),0);return Math.max(S.settings.next||1,max+1)}

/* ---------- render ---------- */
function counts(){const c={inne:0,klar:0};S.orders.forEach(o=>{if(c[o.status]!=null)c[o.status]++});return c}
function renderNav(){
  const c=counts();
  const tabs=[["ny","Ny inlämning",null],["inne","Inne",c.inne],["klar","Klara",c.klar],["alla","Alla",null]];
  document.getElementById("nav").innerHTML=tabs.map(([k,l,n])=>`<button data-view="${k}" aria-current="${S.view===k}">${l}${n?`<span class="count">${n}</span>`:""}</button>`).join("");
}
function render(){
  renderNav();setNet();
  const m=document.getElementById("main");
  if(S.view==="ny"){ if(!m.querySelector("#newform")) m.innerHTML=newFormHtml(); renderItems(); fillNr(); }
  else if(S.view==="pris") m.innerHTML=priceHtml();
  else m.innerHTML=listHtml();
  renderSheet();
}
function newFormHtml(){
  return `<form id="newform" class="stack" autocomplete="off">
  <h2>Ny inlämning</h2>
  <div class="grid2">
    <div class="field"><label class="label" for="f-nr">Kvittonr</label><input id="f-nr" class="nr" inputmode="numeric" value="${esc(draft.nr)}" placeholder="${suggestNr()}"></div>
    <div class="field"><label class="label" for="f-in">Inlämnat den</label><input id="f-in" type="date" value="${draft.inDate}"></div>
  </div>
  <p class="hint" style="margin-top:-6px">Skriv numret från lappen. Lämnar du fältet tomt används ${'<span id="sugg">'+suggestNr()+'</span>'}.</p>
  <div class="field"><label class="label" for="f-name">Namn</label><input id="f-name" value="${esc(draft.name)}" autocapitalize="words" placeholder="Kundens namn"></div>
  <div class="field"><label class="label" for="f-phone">Mobilnummer</label><input id="f-phone" type="tel" inputmode="tel" value="${esc(draft.phone)}" placeholder="070-123 45 67"></div>
  <div class="field"><span class="label">Plagg</span><div class="chips" id="chips">${GARMENTS.map(g=>`<button type="button" class="chip" data-add="${esc(g)}">${esc(g)}</button>`).join("")}<button type="button" class="chip" data-add="">+ Annat</button></div></div>
  <div class="items" id="items"></div>
  <div class="checks"><label><input type="checkbox" id="f-paket" ${draft.paket?"checked":""}> Paket</label><label><input type="checkbox" id="f-galge" ${draft.galge?"checked":""}> Galge</label></div>
  <div class="sum"><span>Summa</span><b id="sum">0 kr</b></div>
  <div class="field"><label class="label" for="f-ready">Leverans den</label><input id="f-ready" type="date" value="${draft.readyDate}"></div>
  <div class="field"><label class="label" for="f-note">Anteckning (syns inte i SMS)</label><input id="f-note" value="${esc(draft.note)}" placeholder="T.ex. fläck på vänster ärm"></div>
  <p id="formerr" class="notice" hidden></p>
  <button class="btn primary" id="save">Spara inlämning</button>
  <button type="button" class="btn ghost small" data-view="pris">Ändra prislista</button>
  </form>`;
}
function renderItems(){
  const box=document.getElementById("items");if(!box)return;
  box.innerHTML=draft.items.length?draft.items.map((it,i)=>`<div class="item">
    <div class="qty"><button type="button" data-q="${i}" data-d="-1" aria-label="Färre">−</button><span>${it.qty}</span><button type="button" data-q="${i}" data-d="1" aria-label="Fler">+</button></div>
    <input data-type="${i}" value="${esc(it.type)}" placeholder="Plagg" aria-label="Plagg">
    <input class="price" data-price="${i}" inputmode="decimal" value="${it.price===""?"":esc(it.price)}" placeholder="kr/st" aria-label="Pris per styck">
    <button type="button" class="x" data-rm="${i}" aria-label="Ta bort">×</button></div>`).join("")
    :`<div class="empty">Tryck på ett plagg ovan för att lägga till det.</div>`;
  updateSum();
}
function updateSum(){const el=document.getElementById("sum");if(el)el.textContent=kr(total(draft.items))}
function statusPill(o){
  if(o.status==="klar")return `<span class="pill klar">Klar att hämta</span>`;
  if(o.status==="hamtad")return `<span class="pill hamtad">Hämtad</span>`;
  if(o.readyDate&&o.readyDate<today())return `<span class="pill late">Försenad</span>`;
  return `<span class="pill inne">Inne</span>`;
}
function listHtml(){
  const titles={inne:"Inne för tvätt",klar:"Klara att hämta",alla:"Alla inlämningar"};
  const q=S.q.trim().toLowerCase();
  let list=S.orders.filter(o=>S.view==="alla"||o.status===S.view);
  if(q)list=list.filter(o=>String(o.nr).includes(q)||o.name.toLowerCase().includes(q)||String(o.phone).replace(/\D/g,"").includes(q.replace(/\D/g,"")||"§"));
  list.sort((a,b)=>S.view==="inne"?(a.readyDate||"").localeCompare(b.readyDate||"")||(+a.nr-+b.nr):(b.updatedAt||0)-(a.updatedAt||0));
  const loading=!S.local&&!S.dbReady&&!S.orders.length;
  const bk=S.view==="alla"?`<div class="stack" style="margin-top:20px"><span class="label">Säkerhetskopia</span>
    <button class="btn ghost small" id="backup">Spara säkerhetskopia</button>
    <button class="btn ghost small" id="csv">Exportera lista till Excel</button>
    <label class="btn ghost small" for="restore">Läs in säkerhetskopia</label><input type="file" id="restore" accept=".json,.csv,application/json,text/csv" hidden>
    <p class="hint">${S.settings.lastBackup?"Senaste kopia: "+new Date(S.settings.lastBackup).toLocaleDateString("sv-SE"):"Ingen kopia sparad än."} Spara kopian i Filer eller iCloud Drive.</p></div>`:"";
  return `<h2>${titles[S.view]}</h2>
  <input class="search" id="q" type="search" placeholder="Sök nummer, namn eller mobil" value="${esc(S.q)}" aria-label="Sök">
  <div class="list">${loading?`<div class="empty">Hämtar inlämningar…</div>`:list.length?list.map(o=>`<button class="stub ${o.status}" data-open="${esc(o.id)}">
    <span class="who">${esc(o.name)}</span><span class="no">${esc(o.nr)}</span>
    <span class="what">${esc(itemsText(o.items))}</span>
    <span class="meta"><span>${statusPill(o)} ${o.status==="inne"&&o.readyDate?"klar "+sv(o.readyDate):o.status==="hamtad"?sv(iso(new Date(o.pickedAt||o.updatedAt))):"in "+sv(o.inDate)}</span><b>${kr(total(o.items))}</b></span>
  </button>`).join(""):`<div class="empty">${q?"Inget matchar sökningen.":S.view==="klar"?"Inget väntar på att hämtas.":S.view==="inne"?"Inget inne just nu. Nya inlämningar hamnar här.":"Inga inlämningar än. Lägg till den första under Ny inlämning."}</div>`}</div>${bk}`;
}
function priceHtml(){
  return `<h2>Prislista</h2><p class="hint">Priset fylls i automatiskt när du trycker på plagget. Du kan alltid ändra det på varje inlämning.</p>
  <div class="prices" style="margin-top:12px">${GARMENTS.map(g=>`<label>${esc(g)}<input inputmode="decimal" data-p="${esc(g)}" value="${S.settings.prices?.[g]??""}" placeholder="kr"></label>`).join("")}</div>
  <div style="margin-top:18px" class="stack"><button class="btn primary" id="saveprices">Spara prislista</button><button class="btn ghost small" data-view="ny">Tillbaka</button></div>`;
}
function renderSheet(){
  const host=document.getElementById("sheet");
  const o=S.orders.find(x=>x.id===S.open);
  if(!o){host.innerHTML="";return}
  if(S.mode==="sent"){renderSentSheet(o);return}
  const sum=kr(total(o.items));
  let body="";
  if(S.mode==="kassa"){
    body=`<div class="kassa"><span class="label">Kvittonr</span><div class="big">${esc(o.nr)}</div><div class="amt">${sum}</div>
    <p class="hint">Knappa in beloppet i Zettle och skriv ${esc(o.nr)} som referens.</p></div>
    <div class="stack"><div class="row">${["Kort","Swish","Kontant"].map(p=>`<button class="btn ok small" data-paid="${p}">${p}</button>`).join("")}</div>
    <p class="hint" style="text-align:center">Tryck på hur kunden betalade så markeras den som hämtad.</p>
    <button class="btn ghost small" data-mode="detail">Tillbaka</button></div>`;
  } else {
    const ready=msgReady(o), inn=msgIn(o);
    body=`<div class="tagcard"><span class="who">${esc(o.name)}</span><span class="no">${esc(o.nr)}</span>
      <span class="sub">${esc(nicePhone(o.phone))} · in ${sv(o.inDate)}${o.readyDate?" · klar "+sv(o.readyDate):""}</span></div>
    <div style="margin-top:10px">${statusPill(o)}${o.paidWith?` <span class="pill hamtad">Betald · ${esc(o.paidWith)}</span>`:""}</div>
    <div class="lines">${o.items.map(i=>`<div><span>${i.qty} × ${esc(i.type)}</span><span>${kr(i.qty*i.price)}</span></div>`).join("")}<div><b>Summa</b><b style="font-family:var(--mono)">${sum}</b></div></div>
    ${o.paket||o.galge?`<p class="hint" style="margin:0 0 8px;font-weight:700;color:var(--fg)">Lämnas ut: ${[o.paket&&"Paket",o.galge&&"Galge"].filter(Boolean).join(" + ")}</p>`:""}
    ${o.note?`<p class="hint" style="margin:0 0 12px">Anteckning: ${esc(o.note)}</p>`:""}
    <div class="stack">
    ${o.status==="inne"?`<a class="btn ok" href="${smsHref(o.phone,ready)}" data-ready="${esc(o.id)}">Klart att hämta – skicka SMS</a>`:""}
    ${o.status==="klar"?`<button class="btn primary" data-mode="kassa">Till kassan · ${sum}</button>
       <a class="btn ghost small" href="${smsHref(o.phone,ready)}">Skicka påminnelse-SMS igen</a>`:""}
    ${o.status==="hamtad"?`<button class="btn ghost small" data-undo="${esc(o.id)}">Ångra hämtad</button>`:""}
    ${o.status!=="hamtad"?`<a class="btn ghost small" href="${smsHref(o.phone,inn)}">Skicka inlämnings-SMS igen</a>`:""}
    <details><summary class="hint" style="cursor:pointer">Visa SMS-texten (om SMS-appen inte öppnas)</summary>
      <div class="msg" style="margin-top:8px">${esc(o.status==="inne"?inn:ready)}</div>
      <p class="hint">Mobil: ${esc(normPhone(o.phone))}</p>
      <button class="btn ghost small" data-copynum="${esc(normPhone(o.phone))}" style="margin-bottom:8px">Kopiera nummer</button>
      <button class="btn ghost small" data-copy="${o.status==="inne"?"in":"ready"}">Kopiera text</button></details>
    ${S.confirmDel?`<div class="confirm">Ta bort inlämning ${esc(o.nr)} för gott?<div class="row"><button class="btn ghost small" data-delno>Avbryt</button><button class="btn primary small" data-delyes="${esc(o.id)}">Ta bort</button></div></div>`
      :`<button class="btn ghost small" data-del>Ta bort inlämning</button>`}
    <button class="btn ghost small" data-close>Stäng</button></div>`;
  }
  host.innerHTML=`<div class="sheet" data-backdrop><div class="panel" role="dialog" aria-label="Inlämning ${esc(o.nr)}">${body}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a,[data-backdrop]");if(!t)return;
  const d=t.dataset;
  if(d.view){S.view=d.view;S.open=null;document.getElementById("main").innerHTML="";render();scrollTo(0,0);return}
  if(d.add!=null){const g=d.add;draft.items.push({type:g,qty:1,price:g&&S.settings.prices?.[g]!=null&&S.settings.prices[g]!==""?+S.settings.prices[g]:""});renderItems();if(!g){const ins=document.querySelectorAll("[data-type]");ins[ins.length-1].focus()}return}
  if(d.q!=null){const it=draft.items[+d.q];it.qty=Math.max(1,it.qty+ +d.d);renderItems();return}
  if(d.rm!=null){draft.items.splice(+d.rm,1);renderItems();return}
  if(d.open){S.open=d.open;S.mode="detail";S.confirmDel=false;renderSheet();return}
  if(d.backdrop!=null&&e.target===t){S.open=null;renderSheet();return}
  if(d.close!=null){S.open=null;renderSheet();return}
  if(d.mode){S.mode=d.mode;renderSheet();return}
  if(d.copynum){copyText(d.copynum,"Numret kopierat");return}
  if(d.copyin){const oo=S.orders.find(x=>x.id===d.copyin);if(oo)copyText(msgIn(oo),"Texten kopierad");return}
  const o=S.orders.find(x=>x.id===S.open);
  if(d.ready&&o){saveOrder({...o,status:"klar",readyAt:Date.now()});toast("Markerad som klar. Tryck Skicka i SMS-appen.");return}
  if(d.paid&&o){saveOrder({...o,status:"hamtad",paidWith:d.paid,pickedAt:Date.now()});S.open=null;renderSheet();toast(`${o.nr} betald (${d.paid}) och hämtad`);return}
  if(d.undo&&o){const n={...o,status:"klar"};delete n.paidWith;delete n.pickedAt;saveOrder(n);return}
  if(d.del!=null){S.confirmDel=true;renderSheet();return}
  if(d.delno!=null){S.confirmDel=false;renderSheet();return}
  if(d.delyes){deleteOrder(d.delyes);S.open=null;S.confirmDel=false;renderSheet();toast("Borttagen");return}
  if(d.copy&&o){const txt=d.copy==="in"?msgIn(o):msgReady(o);navigator.clipboard?.writeText(txt).then(()=>toast("Text kopierad")).catch(()=>{const m=t.parentElement.querySelector(".msg");const r=document.createRange();r.selectNodeContents(m);getSelection().removeAllRanges();getSelection().addRange(r);toast("Markerad – kopiera manuellt")});return}
  if(t.id==="backup"||t.id==="backup2"){backup();return}
  if(t.id==="csv"){exportCsv();return}
  if(t.id==="saveprices"){document.querySelectorAll("[data-p]").forEach(i=>{const v=i.value.replace(",",".").trim();if(v==="")delete S.settings.prices[i.dataset.p];else S.settings.prices[i.dataset.p]=+v});saveSettings();toast("Prislistan sparad");return}
});
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(d.type!=null){draft.items[+d.type].type=t.value;return}
  if(d.price!=null){draft.items[+d.price].price=t.value.replace(",",".");updateSum();return}
  const map={"f-nr":"nr","f-name":"name","f-phone":"phone","f-in":"inDate","f-ready":"readyDate","f-note":"note"};
  if(map[t.id]){draft[map[t.id]]=t.value;return}
  if(t.id==="f-paket"||t.id==="f-galge"){draft[t.id.slice(2)]=t.checked;return}
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener("change",e=>{if(e.target.id==="restore"&&e.target.files[0]){restoreFile(e.target.files[0]);e.target.value=""}});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("formerr");const fail=m=>{err.textContent=m;err.hidden=false};
  err.hidden=true;
  const nr=String(draft.nr||suggestNr()).trim();
  if(!/^\d+$/.test(nr))return fail("Kvittonumret får bara innehålla siffror.");
  if(!draft.name.trim())return fail("Skriv kundens namn.");
  if(normPhone(draft.phone).replace(/\D/g,"").length<8)return fail("Skriv ett mobilnummer så att SMS kan skickas.");
  const items=draft.items.filter(i=>i.type.trim()).map(i=>({type:i.type.trim(),qty:+i.qty||1,price:+i.price||0}));
  if(!items.length)return fail("Lägg till minst ett plagg.");
  const clash=S.orders.find(o=>o.id===nr&&o.status!=="hamtad");
  if(clash)return fail(`Nummer ${nr} används redan av ${clash.name} som inte har hämtat än.`);
  const o={id:nr,nr,name:draft.name.trim(),phone:draft.phone.trim(),items,inDate:draft.inDate,readyDate:draft.readyDate,note:draft.note.trim(),paket:!!draft.paket,galge:!!draft.galge,status:"inne",createdAt:Date.now()};
  await saveOrder(o);
  if(+nr>=(S.settings.next||1)){S.settings.next=+nr+1;saveSettings()}
  draft=draftEmpty();
  document.getElementById("main").innerHTML="";S.open=nr;S.mode="sent";render();
  renderSentSheet(o);
});
function renderSentSheet(o){
  document.getElementById("sheet").innerHTML=`<div class="sheet" data-backdrop><div class="panel" role="dialog" aria-label="Sparad">
    <div class="tagcard"><span class="who">${esc(o.name)}</span><span class="no">${esc(o.nr)}</span><span class="sub">Sparad · ${kr(total(o.items))}</span></div>
    <p class="hint" style="margin:12px 2px">Skicka kvittot till kunden. SMS-appen öppnas med texten ifylld, tryck Skicka där.</p>
    <div class="msg">${esc(msgIn(o))}</div>
    <div class="stack" style="margin-top:14px">
      <a class="btn primary" href="${smsHref(o.phone,msgIn(o))}" data-sentok>Skicka SMS till ${esc(normPhone(o.phone))}</a>
      <p class="hint">Öppnas inte Meddelanden? Kopiera och klistra in själv.</p>
      <div class="row"><button class="btn ghost small" data-copynum="${esc(normPhone(o.phone))}">Kopiera nummer</button><button class="btn ghost small" data-copyin="${esc(o.id)}">Kopiera text</button></div>
      <button class="btn ghost small" data-close>Klar, ny inlämning</button></div></div></div>`;
}
document.addEventListener("click",e=>{if(e.target.closest("[data-sentok]")){setTimeout(()=>{S.open=null;renderSheet()},800)}});

initDb();
</script>

</body>
</html>

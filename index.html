nav{display:flex;gap:4px;margin-top:10px;overflow-x:auto}
nav button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px var(--body);padding:10px 6px 12px;border-bottom:3px solid transparent;white-space:nowrap;cursor:pointer}
nav button[aria-current="true"]{border-bottom-color:var(--tag);color:var(--tag)}
nav .count{font-family:var(--mono);font-size:12px;background:var(--tag-soft);color:var(--tag-ink);border-radius:99px;padding:1px 7px;margin-left:4px}
h2{font-family:var(--display);font-size:22px;font-weight:800;margin:22px 0 12px;text-wrap:balance}
.label{display:block;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field{display:flex;flex-direction:column;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
input[type="date"]{display:block;min-height:48px;text-align:left}
input[type="date"]::-webkit-date-and-time-value{text-align:left}
.stack{display:flex;flex-direction:column;gap:14px}
input,textarea{width:100%;min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;font:500 17px var(--body);color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px;min-height:48px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--tag);outline-offset:1px}
input.nr{font-family:var(--mono);font-size:26px;letter-spacing:.06em;text-align:right;color:var(--tag-ink);background:var(--tag-soft);border-color:transparent}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:700 13px var(--body);letter-spacing:.04em;text-transform:uppercase;padding:10px 12px;border-radius:8px;cursor:pointer}
.chip:active{background:var(--tag-soft)}
.items{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) 84px auto;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item input{min-height:40px;padding:8px;font-size:16px}
@media (min-width:700px){.chip{font-size:15px;padding:14px 18px}.list{display:grid;grid-template-columns:1fr 1fr}.stub .who{font-size:18px}.panel{border-radius:18px;margin-bottom:24px}.sheet{align-items:center}}
.item .price{text-align:right;font-family:var(--mono)}

<script>

const CLOUD=!!(CFG.supabaseUrl&&CFG.supabaseKey&&window.supabase);
let sb=null, session=null, pending={}, local={lastBackup:null,migrated:false};
function lsLoad(){try{const j=JSON.parse(localStorage.getItem(LS)||"null");if(j){S.orders=j.orders||[];S.settings=Object.assign({next:1,prices:{}},j.settings||{});pending=j.pending||{}}
  local=Object.assign(local,JSON.parse(localStorage.getItem(LS_LOCAL)||"{}"));
  if(S.settings.lastBackup&&!local.lastBackup)local.lastBackup=S.settings.lastBackup}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({orders:S.orders,settings:S.settings,pending,savedAt:Date.now()}));localStorage.setItem(LS_LOCAL,JSON.stringify(local));return true}catch(e){toast("Kunde inte spara i enheten!");return false}}
function setNet(){const el=document.getElementById("net");if(!el)return;const n=Object.keys(pending).length;
  if(CLOUD&&!navigator.onLine){el.textContent="Offline – sparas i telefonen och skickas upp när nätet är tillbaka"+(n?` (${n} väntar)`:"")+".";el.hidden=false;return}
  if(CLOUD&&n){el.textContent=`${n} ändring${n>1?"ar":""} väntar på att sparas…`;el.hidden=false;return}
  const days=local.lastBackup?Math.floor((Date.now()-local.lastBackup)/864e5):null;
  if(!CLOUD&&S.orders.length>=5&&(days===null||days>=7)){el.innerHTML=`Ingen säkerhetskopia på ${days===null?"länge":days+" dagar"}. <button class="linkbtn" id="backup2">Spara kopia nu</button>`;el.hidden=false;return}
  el.hidden=true}
function queue(o,del){if(del)pending[o]={__del:true};else pending[o.id]=o}
async function pushOne(id){
  const v=pending[id]; if(!sb||!session||!v)return false;
  const row=v.__del?{id,data:{},deleted:true,updated_at:new Date().toISOString()}:{id,data:v,deleted:false,updated_at:new Date().toISOString()};
  try{const {error}=await sb.from("orders").upsert(row); if(error)return false}catch(e){return false}
  if(pending[id]===v)delete pending[id]; lsSave(); return true;
}
let flushing=false;
async function flush(){ if(flushing||!sb||!session||!navigator.onLine)return; flushing=true;
  for(const id of Object.keys(pending)){ if(!(await pushOne(id)))break }
  flushing=false; setNet() }
async function saveOrder(o){
  o.updatedAt=Date.now();
  const i=S.orders.findIndex(x=>x.id===o.id); if(i>=0)S.orders[i]=o; else S.orders.push(o);
  if(CLOUD)queue(o); lsSave(); render(); flush();
}
async function deleteOrder(id){S.orders=S.orders.filter(x=>x.id!==id);if(CLOUD)queue(id,true);lsSave();render();flush()}
async function saveSettings(){lsSave(); if(sb&&session){try{await sb.from("settings").upsert({id:"main",data:S.settings,updated_at:new Date().toISOString()})}catch(e){}}}
function applyRow(r){
  if(pending[r.id])return;
  const i=S.orders.findIndex(x=>x.id===r.id);
  if(r.deleted){if(i>=0)S.orders.splice(i,1)}
  else if(i>=0)S.orders[i]=r.data; else S.orders.push(r.data);
}
async function pull(){
  if(!sb||!session||!navigator.onLine)return;
  try{
    const {data,error}=await sb.from("orders").select("id,data").eq("deleted",false).limit(10000);
    if(error)return;
    const map=new Map(data.map(r=>[r.id,r.data]));
    for(const [id,v] of Object.entries(pending)){ if(v.__del)map.delete(id); else map.set(id,v) }
    S.orders=[...map.values()];
    const st=await sb.from("settings").select("data").eq("id","main").maybeSingle();
    if(st.data&&st.data.data)S.settings=Object.assign({next:1,prices:{}},st.data.data);
    S.dbReady=true; lsSave(); render();
  }catch(e){}
}
let channel=null;
function subscribe(){
  if(channel)sb.removeChannel(channel);
  channel=sb.channel("mb-orders")
    .on("postgres_changes",{event:"*",schema:"public",table:"orders"},p=>{if(p.new&&p.new.id){applyRow(p.new);lsSave();render()}})
    .on("postgres_changes",{event:"*",schema:"public",table:"settings"},p=>{if(p.new&&p.new.data){S.settings=Object.assign({next:1,prices:{}},p.new.data);lsSave()}})
    .subscribe();
}
async function afterLogin(){
  hideLogin();
  if(!local.migrated){ // första inloggningen i den här telefonen: ladda upp det som bara fanns här
    S.orders.forEach(o=>{if(!pending[o.id])queue(o)}); local.migrated=true; lsSave();
  }
  await flush(); await pull(); subscribe(); render();
}
function showLogin(msg){
  document.getElementById("login").hidden=false;
  const er=document.getElementById("loginerr"); er.textContent=msg||""; er.hidden=!msg;
}
function hideLogin(){document.getElementById("login").hidden=true}
async function initDb(){
  lsLoad(); S.local=false; S.dbReady=true; render();
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist() }catch(e){}
  if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>r.update()).catch(()=>{}) }
  if(!CLOUD)return;
  sb=supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data}=await sb.auth.getSession(); session=data.session;
  sb.auth.onAuthStateChange((ev,s)=>{ if(s)session=s; if(ev==="SIGNED_OUT"){session=null;showLogin()} });
  if(session) afterLogin(); else showLogin();
  window.addEventListener("online",()=>{setNet();flush().then(pull)});
  window.addEventListener("offline",setNet);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&session){flush().then(pull)}});
  setInterval(()=>{if(session&&Object.keys(pending).length)flush()},20000);
}
document.addEventListener("submit",async e=>{
  if(e.target.id!=="loginform")return; e.preventDefault(); e.stopImmediatePropagation();
  const btn=document.getElementById("loginbtn"); btn.disabled=true; btn.textContent="Loggar in…";
  let res; try{res=await sb.auth.signInWithPassword({email:document.getElementById("l-email").value.trim(),password:document.getElementById("l-pass").value})}catch(err){res={error:err}}
  btn.disabled=false; btn.textContent="Logga in";
  if(res.error){showLogin(navigator.onLine?"Fel e-post eller lösenord.":"Ingen internetanslutning. Försök igen när du har nät.");return}
  session=res.data.session; afterLogin();
},true);
async function logout(){ if(Object.keys(pending).length){toast("Vänta tills allt är sparat innan du loggar ut");return}
  await sb.auth.signOut(); S.orders=[]; local.migrated=true; lsSave(); render(); showLogin() }
/* ---------- backup & restore ---------- */
function csvCell(v){v=String(v??"");return /[";\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
async function giveFile(name,text,type){
  const blob=new Blob([text],{type});
  try{ const f=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true} }catch(e){ if(e&&e.name==="AbortError")return false }
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true;
}
async function backup(){
  const ok=await giveFile(`MB-arkiv-${today()}.json`,JSON.stringify({app:"mb-tvatt",version:1,exportedAt:new Date().toISOString(),orders:S.orders,settings:S.settings},null,1),"application/json");
  if(ok){local.lastBackup=Date.now();lsSave();setNet();toast("Säkerhetskopian sparad")}
}
async function exportCsv(){
  const rows=[["Kvittonr","Namn","Mobil","Plagg","Summa kr","Status","Inlämnat","Leverans","Paket","Galge","Betalt med","Anteckning"]];
  realOrders().sort((a,b)=>+a.nr-+b.nr).forEach(o=>rows.push([o.nr,o.name,o.phone,o.items.map(i=>`${i.qty} ${i.type} á ${i.price}`).join(", "),total(o.items),{inne:"Inne",klar:"Klar att hämta",hamtad:"Hämtad"}[o.status],o.inDate,o.readyDate,o.paket?"Ja":"",o.galge?"Ja":"",o.paidWith||"",o.note||""]));
  await giveFile(`MB-lista-${today()}.csv`,"﻿"+rows.map(r=>r.map(csvCell).join(";")).join("\r\n"),"text/csv");
}
function parseCsv(t){t=t.replace(/^﻿/,"");const rows=[];let row=[],cell="",q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){cell+='"';i++}else q=false}else cell+=c}
    else if(c=='"')q=true; else if(c==';'){row.push(cell);cell=""} else if(c=='\n'){row.push(cell);rows.push(row);row=[];cell=""} else if(c!='\r')cell+=c}
  if(cell||row.length){row.push(cell);rows.push(row)} return rows}
function ordersFromCsv(t){const rows=parseCsv(t);const h=rows.shift()||[];if(h[0]!=="Kvittonr")throw new Error("fel format");
  const st={"Inne":"inne","Klar att hämta":"klar","Hämtad":"hamtad"};
  return rows.filter(r=>r[0]).map(r=>({id:r[0],nr:r[0],name:r[1],phone:r[2],
    items:(r[3]||"").split(", ").filter(Boolean).map(x=>{const m=x.match(/^(\d+) (.+?) á ([\d.]+)$/);return m?{qty:+m[1],type:m[2],price:+m[3]}:{qty:1,type:x,price:0}}),
    status:st[r[5]]||"inne",inDate:r[6],readyDate:r[7],paket:r[8]==="Ja",galge:r[9]==="Ja",paidWith:r[10]||undefined,note:r[11]||"",createdAt:Date.now(),updatedAt:Date.now()}))}
async function restoreFile(file){
  try{const t=await file.text();let list,settings=null;
    if(/^\s*\{/.test(t)){const j=JSON.parse(t);list=j.orders||[];settings=j.settings||null}else list=ordersFromCsv(t);
    const map=new Map(S.orders.map(o=>[o.id,o]));let added=0;
    list.forEach(o=>{const cur=map.get(o.id);if(!cur||(o.updatedAt||0)>(cur.updatedAt||0)){map.set(o.id,o);added++}});
    S.orders=[...map.values()];
    if(settings){S.settings.prices=Object.assign({},settings.prices||{},S.settings.prices);S.settings.next=Math.max(S.settings.next||1,settings.next||1)}
    if(CLOUD)list.forEach(o=>{if(map.get(o.id)===o)queue(o)});
    lsSave();render();flush();toast(`${added} inlämningar inlästa`);
  }catch(e){toast("Filen kunde inte läsas. Välj en MB-arkiv-fil.")}
}
function fillNr(){const n=String(suggestNr());const el=document.getElementById("f-nr");if(el)el.placeholder=n;const sg=document.getElementById("sugg");if(sg)sg.textContent=n}
function suggestNr(){const max=realOrders().reduce((m,o)=>Math.max(m,+o.nr||0),0);return max?max+1:(+S.settings.start||1)}

/* ---------- render ---------- */
function counts(){const c={inne:0,klar:0};realOrders().forEach(o=>{if(c[o.status]!=null)c[o.status]++});return c}
function renderNav(){
  const c=counts();
  const tabs=[["ny","Ny",null],["inne","Inne",c.inne],["klar","Klara",c.klar],["alla","Alla",null],["aw","Arbetskläder",null],["fs","Följesedlar",null],["pl","Inlämningsställen",null]];
  document.getElementById("nav").innerHTML=tabs.map(([k,l,n])=>`<button data-view="${k}" aria-current="${S.view===k}">${l}${n?`<span class="count">${n}</span>`:""}</button>`).join("");
}
function render(){
  const fid=document.activeElement&&document.activeElement.id;
  renderNav();setNet();

  if(S.view==="ny"){ if(!m.querySelector("#newform")) m.innerHTML=newFormHtml(); renderItems(); fillNr(); }
  else if(S.view==="pris") m.innerHTML=priceHtml();
  else if(S.view==="fs") m.innerHTML=fsListHtml();
  else if(S.view==="aw") m.innerHTML=awTabHtml();

}

function statusPill(o){
  if(o.status==="klar")return `<span class="pill klar">Klar att hämta</span>`;
  if(o.status==="hamtad")return `<span class="pill hamtad">Hämtad</span>`;
  if(o.readyDate&&o.readyDate<today())return `<span class="pill late">Försenad</span>`;
  return `<span class="pill inne">Inne</span>`;
}

    <div style="margin-top:10px">${statusPill(o)}${o.status==="hamtad"?` <span class="pill hamtad">Betald</span>`:""}</div>
    <div class="lines">${o.items.map(i=>`<div><span>${i.qty} × ${esc(i.type)}</span><span>${kr(i.qty*i.price)}</span></div>`).join("")}<div><b>Summa</b><b style="font-family:var(--mono)">${sum}</b></div></div>
    ${o.paket||o.galge?`<p class="hint" style="margin:0 0 8px;font-weight:700;color:var(--fg)">Lämnas ut: ${[o.paket&&"Paket",o.galge&&"Galge"].filter(Boolean).join(" + ")}</p>`:""}
    ${o.note?`<p class="hint" style="margin:0 0 12px">Anteckning: ${esc(o.note)}</p>`:""}
    ${o.status!=="hamtad"?smsToggle():""}
    <div class="stack">
    ${o.status==="inne"?`<a class="btn ok" href="${smsHref(o.phone,ready)}" data-ready="${esc(o.id)}">Klart att hämta – skicka SMS</a>`:""}
    ${o.status==="klar"?`<button class="btn primary" data-mode="kassa">Till kassan · ${sum}</button>
       <a class="btn ghost small" href="${smsHref(o.phone,ready)}">Skicka påminnelse-SMS igen</a>`:""}
    ${o.status==="klar"?`<button class="btn ghost small" data-unready="${esc(o.id)}">Ångra klar – flytta tillbaka till Inne</button>`:""}
    <button class="btn ghost small" data-startedit="${esc(o.id)}">Ändra</button>
    ${o.status==="hamtad"?`<a class="btn ghost small" href="${smsHref(o.phone,msgReview(o))}" data-reviewsent="${esc(o.id)}">${o.reviewSent?"Skicka omdömes-SMS igen":"Be om omdöme på Google (SMS)"}</a>
       <button class="btn ghost small" data-undo="${esc(o.id)}">Ångra hämtad</button>`:""}
    ${o.status!=="hamtad"?`<a class="btn ghost small" href="${smsHref(o.phone,inn)}">Skicka inlämnings-SMS igen</a>`:""}
    <details><summary class="hint" style="cursor:pointer">Visa SMS-texten (om SMS-appen inte öppnas)</summary>
      <div class="msg" style="margin-top:8px">${esc(o.status==="inne"?inn:ready)}</div>
      <p class="hint">Mobil: ${esc(fmtPhone(o.phone))}</p>
      <button class="btn ghost small" data-copynum="${esc(normPhone(o.phone))}" style="margin-bottom:8px">Kopiera nummer</button>
      <button class="btn ghost small" data-copy="${o.status==="inne"?"in":"ready"}">Kopiera text</button></details>
    ${S.confirmDel?`<div class="confirm">Ta bort inlämning ${esc(o.nr)} för gott?<div class="row"><button class="btn ghost small" data-delno>Avbryt</button><button class="btn primary small" data-delyes="${esc(o.id)}">Ta bort</button></div></div>`
      :`<button class="btn ghost small" data-del>Ta bort inlämning</button>`}
    <button class="btn ghost small" data-close>Stäng</button></div>`;
  }
  host.innerHTML=`<div class="sheet" data-backdrop><div class="panel" role="dialog" aria-label="Inlämning ${esc(o.nr)}">${body}</div></div>`;
}

function editHtml(){
  const e=S.edit;
  return `<div id="editor" class="stack">
    <div class="tagcard"><span class="who">Ändra inlämning</span><span class="no">${esc(e.nr)}</span></div>
    <div class="grid2">
      <div class="field"><label class="label" for="e-nr">Kvittonr</label><input id="e-nr" class="nr" inputmode="numeric" value="${esc(e.nr)}"></div>
      <div class="field"><label class="label" for="e-in">Inlämnat den</label><input id="e-in" type="date" value="${esc(e.inDate||"")}"></div></div>
    <div class="field"><label class="label" for="e-name">Namn</label><input id="e-name" value="${esc(e.name)}" autocapitalize="words"></div>
    <div class="field"><label class="label" for="e-phone">Mobilnummer</label><input id="e-phone" type="tel" inputmode="tel" value="${esc(e.phone)}"></div>
    <div class="chips">${garments().map(g=>`<button type="button" class="chip" data-eadd="${esc(g)}">${esc(g)}</button>`).join("")}<button type="button" class="chip" data-eadd="">+ Annat</button></div>
    <div class="items" id="eitems">${editItemsHtml()}</div>
    <div class="sum" style="padding-top:0"><span>Summa</span><b id="esum">${kr(total(e.items))}</b></div>
    <div class="checks"><label><input type="checkbox" id="e-paket" ${e.paket?"checked":""}> Paket</label><label><input type="checkbox" id="e-galge" ${e.galge?"checked":""}> Galge</label></div>
    <div class="field"><label class="label" for="e-note">Anteckning (syns inte i SMS)</label><input id="e-note" value="${esc(e.note||"")}"></div>
    <p id="editerr" class="notice" hidden></p>
    <button class="btn primary" data-esave>Spara ändringar</button>
    <button class="btn ghost small" data-ecancel>Avbryt</button>
  </div>`;
}
function editItemsHtml(){
  const e=S.edit;
  return e.items.length?e.items.map((it,i)=>`<div class="item">
    <div class="qty"><button type="button" data-eq="${i}" data-d="-1" aria-label="Färre">−</button><span>${it.qty}</span><button type="button" data-eq="${i}" data-d="1" aria-label="Fler">+</button></div>
    <input data-etype="${i}" value="${esc(it.type)}" placeholder="Plagg" aria-label="Plagg">
    <input class="price" data-eprice="${i}" inputmode="decimal" value="${it.price===""?"":esc(it.price)}" placeholder="kr/st" aria-label="Pris per styck">
    <button type="button" class="x" data-erm="${i}" aria-label="Ta bort">×</button></div>`).join("")
    :`<div class="empty">Tryck på ett plagg ovan för att lägga till det.</div>`;
}
function redrawEditItems(){const b=document.getElementById("eitems");if(b)b.innerHTML=editItemsHtml();const s=document.getElementById("esum");if(s)s.textContent=kr(total(S.edit.items))}

/* ---------- PDF av följesedel (ingen webbadress/datum från webbläsaren) ---------- */
function fsMakePdf(o,opt){
  const {jsPDF}=window.jspdf;
  const A5=opt.size==="A5", f=A5?0.78:1;
  const doc=new jsPDF({unit:"mm",format:A5?"a5":"a4",orientation:"portrait"});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), m=A5?11:16;
  const BLUE=[21,115,196], INK=[22,32,44], GREY=[93,104,120], RULE=[213,221,231];
  const pt=n=>n*f;
  const mny=n=>kr(n).replace(/[\u00a0\u202f]/g," ");
  let y=m;
  // logga
  const lw=(A5?46:60), lh=lw*686/2339;
  doc.addImage(LOGO_DATA,"PNG",m,y,lw,lh);
  // rubrik + nummer/datum
  doc.setFont("helvetica","bold");doc.setTextColor(...BLUE);doc.setFontSize(pt(21));
  doc.text("FÖLJESEDEL",W-m,y+pt(7),{align:"right"});
  doc.setFontSize(pt(7.5));doc.setTextColor(...GREY);
  doc.text("NUMMER",W-m-pt(50),y+pt(14));doc.text("DATUM",W-m-pt(50),y+pt(19.5));
  doc.setFont("courier","bold");doc.setFontSize(pt(10.5));doc.setTextColor(...INK);
  doc.text(String(o.nr),W-m,y+pt(14),{align:"right"});doc.text(String(o.date),W-m,y+pt(19.5),{align:"right"});
  y=Math.max(y+lh,y+pt(21))+pt(5);
  doc.setDrawColor(...BLUE);doc.setLineWidth(0.6);doc.line(m,y,W-m,y);
  y+=pt(9);
  // kund / från
  const col2=W/2+2;
  const block=(x,label,lines)=>{let yy=y;doc.setFont("helvetica","bold");doc.setFontSize(pt(7.5));doc.setTextColor(...GREY);doc.text(label,x,yy);yy+=pt(5.5);
    lines.forEach((l,i)=>{doc.setFont("helvetica",i===0?"bold":"normal");doc.setFontSize(pt(10.5));doc.setTextColor(...INK);
      doc.splitTextToSize(l,W/2-m-4).forEach(t=>{doc.text(t,x,yy);yy+=pt(5)})});return yy};
  const yA=block(m,"KUND",[o.customer||"",o.ref?"Ref: "+o.ref:"",o.phone?"Tel: "+o.phone:""].filter(Boolean));
  const yB=block(col2,"FRÅN",[COMPANY.name,COMPANY.addr1,COMPANY.addr2,"Tel: "+COMPANY.tel]);
  y=Math.max(yA,yB)+pt(6);
  // tabell
  const P=opt.priced;
  const xQty=m+pt(14), xArt=m+pt(18), xPrice=W-m-pt(32), xAmt=W-m;
  const head=()=>{doc.setFont("helvetica","bold");doc.setFontSize(pt(7.5));doc.setTextColor(...GREY);
    doc.text("ANTAL",xQty,y,{align:"right"});doc.text("ARTIKEL",xArt,y);
    if(P){doc.text("À-PRIS",xPrice,y,{align:"right"});doc.text("BELOPP",xAmt,y,{align:"right"})}
    y+=pt(2.5);doc.setDrawColor(...INK);doc.setLineWidth(0.4);doc.line(m,y,W-m,y);y+=pt(6)};
  head();
  const footRoom=pt(14);
  o.items.forEach(i=>{
    const artW=(P?xPrice-pt(24):W-m)-xArt;
    const lines=doc.splitTextToSize(String(i.type),artW);
    const rowH=lines.length*pt(5)+pt(3);
    if(y+rowH>H-m-footRoom){doc.addPage();y=m+pt(4);head()}
    doc.setFont("helvetica","normal");doc.setFontSize(pt(10.5));doc.setTextColor(...INK);
    doc.text(String(i.qty),xQty,y,{align:"right"});lines.forEach((t,k)=>doc.text(t,xArt,y+k*pt(5)));
    if(P){doc.text(mny(i.price),xPrice,y,{align:"right"});doc.text(mny(i.qty*i.price),xAmt,y,{align:"right"})}
    y+=rowH-pt(3)+pt(2);doc.setDrawColor(...RULE);doc.setLineWidth(0.25);doc.line(m,y,W-m,y);y+=pt(6);
  });
  if(y>H-m-footRoom-pt(16)){doc.addPage();y=m+pt(4)}
  if(P){
    doc.setDrawColor(...INK);doc.setLineWidth(0.4);doc.line(m,y-pt(4),W-m,y-pt(4));y+=pt(1);
    const sum=total(o.items);
    doc.setFont("helvetica","bold");doc.setFontSize(pt(12));doc.setTextColor(...INK);
    doc.text("Summa att betala",m,y);doc.text(mny(sum),xAmt,y,{align:"right"});y+=pt(5.5);
    doc.setFont("helvetica","normal");doc.setFontSize(pt(9));doc.setTextColor(...GREY);
    doc.text("Varav moms 25 %",m,y);doc.text(mny(sum*0.2),xAmt,y,{align:"right"});y+=pt(8);
  }else{y+=pt(2)}
  // meddelande
  if(o.note){
    const lines=doc.splitTextToSize(o.note,W-2*m-8);const bh=lines.length*pt(5)+pt(5);
    if(y+bh>H-m-footRoom){doc.addPage();y=m+pt(4)}
    doc.setFillColor(241,245,250);doc.rect(m,y-pt(1),W-2*m,bh,"F");doc.setFillColor(...BLUE);doc.rect(m,y-pt(1),1,bh,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(pt(10.5));doc.setTextColor(...INK);
    lines.forEach((t,k)=>doc.text(t,m+5,y+pt(4)+k*pt(5)));y+=bh+pt(4);
  }
  // sidfot på varje sida
  const n=doc.getNumberOfPages();
  for(let pg=1;pg<=n;pg++){doc.setPage(pg);
    doc.setDrawColor(...RULE);doc.setLineWidth(0.25);doc.line(m,H-m-pt(5),W-m,H-m-pt(5));
    doc.setFont("helvetica","normal");doc.setFontSize(pt(7.5));doc.setTextColor(...GREY);
    doc.text(`${COMPANY.name} · ${COMPANY.addr1}, ${COMPANY.addr2} · Tel ${COMPANY.tel} · Org.nr ${COMPANY.orgnr}`,W/2,H-m,{align:"center"});
    if(n>1)doc.text(`Sida ${pg} av ${n}`,W-m,H-m-pt(7),{align:"right"});
  }
  return doc;
}
async function fsPrintPdf(o){
  if(!window.jspdf){try{window.print()}catch(_){toast("Utskrift stöds inte här")}return}
  const opt=pvOpts(), doc=fsMakePdf(o,opt);
  const name=`Foljesedel-${o.nr}${opt.priced?"":"-utan-pris"}-${opt.size}.pdf`;
  const blob=doc.output("blob");
  const file=new File([blob],name,{type:"application/pdf"});
  const touch=matchMedia("(pointer:coarse)").matches;
  try{ if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:`Följesedel ${o.nr}`});return} }
  catch(e){ if(e&&e.name==="AbortError")return }
  const url=URL.createObjectURL(blob);
  const w=window.open(url,"_blank");
  if(!w){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ---------- gemensamma PDF-verktyg ---------- */
function pdfKit(size){
  const {jsPDF}=window.jspdf;
  const A5=size==="A5", f=A5?0.78:1;
  const doc=new jsPDF({unit:"mm",format:A5?"a5":"a4",orientation:"portrait"});
  const W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), m=A5?11:16;
  const BLUE=[21,115,196], INK=[22,32,44], GREY=[93,104,120], RULE=[213,221,231];
  const pt=n=>n*f, U=W-2*m;
  const K={doc,W,H,m,y:m,pt,BLUE,INK,GREY,RULE};
  K.mny=n=>kr(n).replace(/[  ]/g," ");
  K.font=(style,size,color)=>{doc.setFont(style==="mono"?"courier":"helvetica",style==="mono"?"bold":style);doc.setFontSize(pt(size));doc.setTextColor(...(color||INK))};
  K.bottom=()=>H-m-pt(12);
  K.ensure=h=>{if(K.y+h>K.bottom()){doc.addPage();K.y=m+pt(4);return true}return false};
  K.header=(title,meta)=>{
    const lw=A5?46:60, lh=lw*686/2339;
    doc.addImage(LOGO_DATA,"PNG",m,K.y,lw,lh);
    K.font("bold",19,BLUE);doc.text(title,W-m,K.y+pt(7),{align:"right"});
    let yy=K.y+pt(14);
    meta.forEach(([l,v])=>{K.font("bold",7.5,GREY);doc.text(l.toUpperCase(),W-m-pt(58),yy);K.font("mono",10);doc.text(String(v),W-m,yy,{align:"right"});yy+=pt(5.5)});
    K.y=Math.max(K.y+lh,yy-pt(3))+pt(5);
    doc.setDrawColor(...BLUE);doc.setLineWidth(0.6);doc.line(m,K.y,W-m,K.y);K.y+=pt(9);
  };
  K.parties=(left,right)=>{
    const block=(x,label,lines)=>{let yy=K.y;K.font("bold",7.5,GREY);doc.text(label,x,yy);yy+=pt(5.5);

    });

    else K.y+=pt(2);
  };
  K.note=t=>{const lines=doc.splitTextToSize(t,U-8);const bh=lines.length*pt(5)+pt(5);K.ensure(bh+pt(2));
    doc.setFillColor(241,245,250);doc.rect(m,K.y-pt(1),U,bh,"F");doc.setFillColor(...BLUE);doc.rect(m,K.y-pt(1),1,bh,"F");
    K.font("normal",10.5);lines.forEach((l,k)=>doc.text(l,m+5,K.y+pt(4)+k*pt(5)));K.y+=bh+pt(4)};
  K.finish=()=>{const n=doc.getNumberOfPages();for(let p=1;p<=n;p++){doc.setPage(p);
    doc.setDrawColor(...RULE);doc.setLineWidth(0.25);doc.line(m,H-m-pt(5),W-m,H-m-pt(5));K.font("normal",7.5,GREY);

    if(n>1)doc.text(`Sida ${p} av ${n}`,W-m,H-m-pt(7),{align:"right"})}return doc};
  return K;
}
async function pdfDeliver(doc,name,title){
  const blob=doc.output("blob");
  const file=new File([blob],name,{type:"application/pdf"});
  const touch=matchMedia("(pointer:coarse)").matches;
  try{ if(touch&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title});return} }
  catch(e){ if(e&&e.name==="AbortError")return }
  const url=URL.createObjectURL(blob);
  const w=window.open(url,"_blank");
  if(!w){const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove()}
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
function needPdf(){if(!window.jspdf){toast("PDF-verktyget har inte laddats. Kontrollera nätet och öppna appen igen.");return false}return true}

/* ---------- perioder ---------- */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return {year:t.getUTCFullYear(),week:Math.ceil(((t-y0)/864e5+1)/7)}}
function periods(type){
  const out=[], now=new Date();
  if(type==="week"){
    const mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
    for(let i=0;i<26;i++){const s=new Date(mon);s.setDate(mon.getDate()-7*i);const e=new Date(s);e.setDate(s.getDate()+6);const w=isoWeek(s);
      out.push({label:`Vecka ${w.week} ${w.year} (${sv(iso(s))}–${sv(iso(e))})`,short:`Vecka ${w.week} ${w.year}`,from:iso(s),to:iso(e),file:`v${w.week}-${w.year}`})}
  }else{
    for(let i=0;i<24;i++){const s=new Date(now.getFullYear(),now.getMonth()-i,1);const e=new Date(s.getFullYear(),s.getMonth()+1,0);
      const l=s.toLocaleDateString("sv-SE",{month:"long",year:"numeric"});out.push({label:l.charAt(0).toUpperCase()+l.slice(1),short:l,from:iso(s),to:iso(e),file:`${s.getFullYear()}-${String(s.getMonth()+1).padStart(2,"0")}`})}
  }
  return out;
}
const inPeriod=(d,p)=>d&&d>=p.from&&d<=p.to;

  K.h2("Alla inlämningar");

  K.table([{label:"Nr",w:.09,align:"right"},{label:"Datum",w:.11},{label:"Namn",w:.22,wrap:true},{label:"Plagg",w:.32,wrap:true},{label:"Status",w:.11},{label:"Belopp",w:.15,align:"right"}],

}

/* PDF */
function itemsTableK(K,items,sumLabel){
  const P=items.some(priced), pcs=pcsOf(items);
  if(P){const s=total(items);
    K.table([{label:"Antal",w:.12,align:"right"},{label:"Artikel",w:.48,wrap:true},{label:"À-pris",w:.18,align:"right"},{label:"Belopp",w:.22,align:"right"}],
      items.map(i=>[i.qty,i.type,priced(i)?K.mny(i.price):"",priced(i)?K.mny(i.qty*i.price):""]),["",sumLabel,"",K.mny(s)]);
  }else{
    K.table([{label:"Antal",w:.14,align:"right"},{label:"Artikel",w:.86,wrap:true}],items.map(i=>[i.qty,i.type]));
  }
  return P;
}
function coParty(c){return ["KUND",c.name,c.orgnr?"Org.nr: "+c.orgnr:"",c.contact?"Ref: "+c.contact:"",c.address||"",c.email||""]}
const fromParty=()=>["FRÅN",COMPANY.name,COMPANY.addr1,COMPANY.addr2,"Tel: "+COMPANY.tel];
function awOrderPdf(o){
  if(!needPdf())return;
  const c=S.orders.find(x=>x.id===o.companyId)||{name:o.companyName||""};
  const K=pdfKit("A4");
  K.header("Arbetskläder",[["Datum",o.date]]);
  K.parties(coParty(c),fromParty());
  if(itemsTableK(K,o.items,"Summa"))K.kv([["Varav moms 25 %",K.mny(total(o.items)*0.2)]]);
  if(o.note)K.note(o.note);
  K.finish();
  pdfDeliver(K.doc,`Arbetsklader-${fileSafe(c.name)}-${o.date}.pdf`,`Arbetskläder ${o.date}`);
}
function invoicePdf(c){
  if(!needPdf())return;
  const os=invOrders(c), v=S.inv, p=v.mode==="period"?periods(v.type)[v.idx]:null;
  const K=pdfKit("A4");
  K.header("Fakturaunderlag",[["Period",p?p.short:"Ej fakturerat"],["Skapad",today()]]);
  K.parties(coParty(c),[...fromParty(),"Org.nr: "+COMPANY.orgnr]);
  let anyP=false;
  os.forEach(o=>{K.h2(fmtDate(o.date));if(itemsTableK(K,o.items,"Delsumma"))anyP=true;if(o.note)K.note(o.note)});
  const all=os.flatMap(o=>o.items), sum=total(all);
  if(anyP){K.h2("Att fakturera");K.kv([["Summa (inkl. moms)",K.mny(sum),true],["Varav moms 25 %",K.mny(sum*0.2)],["Summa exkl. moms",K.mny(sum*0.8)]])}
  K.finish();
  pdfDeliver(K.doc,`Fakturaunderlag-${fileSafe(c.name)}-${p?p.file:today()}.pdf`,`Fakturaunderlag ${c.name}`);
}

/* ark-hantering */
function renderAwSheet(host,force){
  const m=S.mode, had=!!host.querySelector(".sheet"), wrap=h=>`<div class="sheet${had?" noanim":""}" data-awbackdrop><div class="panel" role="dialog">${h}</div></div>`;
  const keep=k=>!force&&host.querySelector(`[data-form="${k}"]`);
  if(m==="report"){host.innerHTML=wrap(reportSheetHtml());return true}
  if(m==="coedit"){if(keep("co"))return true;host.innerHTML=wrap(coFormHtml(S.coedit||{}));return true}
  if(m==="awcats"){if(keep("awcats"))return true;host.innerHTML=wrap(awCatsHtml());return true}
  if(m==="awedit"){if(keep("aw"))return true;host.innerHTML=wrap(awFormHtml());return true}
  if(m==="invoice"){const c=S.orders.find(x=>x.id===S.coId);if(!c){closeSheet();return true}host.innerHTML=wrap(invoiceHtml(c));return true}
  if(m==="awdetail"){const o=S.orders.find(x=>x.id===S.awId);if(!o){closeSheet();return true}host.innerHTML=wrap(awDetailHtml(o));return true}
  return false;
}
function openSheet(mode,extra){Object.assign(S,{mode,confirmDel:false,awDelAsk:false,open:"__aw"},extra||{});renderSheet(true);const p=document.querySelector(".panel");if(p)p.scrollTop=0}
function closeSheet(){S.open=null;S.mode="";S.awedit=null;S.awcatsDraft=null;document.getElementById("sheet").innerHTML="";render()}
document.addEventListener("click",e=>{
  if(e.target.matches&&e.target.matches("[data-awbackdrop]")){closeSheet();return}
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.view){S.coId=null;S.sel=[]}
  if(d.sheetclose!=null){closeSheet();return}
  // rapport
  if(t.id==="report"){S.rep=S.rep||{type:"month",idx:0};openSheet("report");return}
  if(d.reptype){S.rep={type:d.reptype,idx:0};renderSheet(true);return}
  if(d.repmake!=null){makeReport();return}
  // företag
  if(d.conew!=null){openSheet("coedit",{coedit:{}});return}
  if(d.coopen){S.coId=d.coopen;S.sel=[];S.awf="open";S.coDelAsk=false;S.selDelAsk=false;render();scrollTo(0,0);return}
  if(d.coclose!=null){S.coId=null;S.sel=[];render();scrollTo(0,0);return}
  if(d.coedit){openSheet("coedit",{coedit:JSON.parse(JSON.stringify(S.orders.find(x=>x.id===d.coedit)||{}))});return}
  if(d.codelask!=null){S.coDelAsk=true;render();return}
  if(d.codelno!=null){S.coDelAsk=false;render();return}
  if(d.codel){deleteOrder(d.codel);S.coId=null;S.coDelAsk=false;render();toast("Företaget borttaget");return}
  if(d.cosave!=null){
    const v=id=>document.getElementById(id).value.trim(), err=document.getElementById("coerr");
    const name=v("co-name");if(!name){err.textContent="Skriv företagets namn.";err.hidden=false;return}
    const old=S.coedit||{}, id=old.id||("co-"+Date.now().toString(36));
    saveOrder({...old,id,kind:"co",name,orgnr:v("co-orgnr"),contact:v("co-contact"),phone:v("co-phone"),email:v("co-email"),address:v("co-address"),note:v("co-note"),createdAt:old.createdAt||Date.now()});
    S.coId=id;S.sel=[];closeSheet();toast("Företaget sparat");return}
  // urval av ordrar
  if(d.awf){S.awf=d.awf;S.sel=[];S.selDelAsk=false;render();return}
  if(d.selclear!=null){S.sel=[];S.selDelAsk=false;render();return}
  if(d.seldel!=null){S.selDelAsk=true;render();return}
  if(d.seldelno!=null){S.selDelAsk=false;render();return}
  if(d.seldelyes!=null){const n=S.sel.length;S.sel.forEach(id=>deleteOrder(id));S.sel=[];S.selDelAsk=false;render();toast(`${n} ${n>1?"ordrar":"order"} borttagna`);return}
  if(d.selbill!=null||d.selunbill!=null){const st=d.selbill!=null?"fakturerad":"ej";const os=S.orders.filter(o=>S.sel.includes(o.id)&&(st==="fakturerad"?o.status!=="fakturerad":o.status==="fakturerad"));
    os.forEach(o=>saveOrder({...o,status:st}));S.sel=[];render();toast(st==="fakturerad"?`${os.length} markerade som fakturerade`:`${os.length} ändrade till ej fakturerade`);return}
  // order
  if(d.awnew){openSheet("awedit",{awedit:{id:null,kind:"aw",companyId:d.awnew,nr:String(awNext()),date:today(),items:[],note:"",status:"ej"}});return}
  if(d.awopen){openSheet("awdetail",{awId:d.awopen});return}
  if(d.awedit){openSheet("awedit",{awedit:JSON.parse(JSON.stringify(S.orders.find(x=>x.id===d.awedit)))});return}
  if(d.awadd!=null&&S.awedit){const k=awCats().find(x=>x.name===d.awadd);S.awedit.items.push({type:d.awadd,qty:1,price:k&&k.price!==""&&k.price!=null?+k.price:""});awRedraw();if(!d.awadd){const ins=document.querySelectorAll("[data-awtype]");ins[ins.length-1].focus()}return}
  if(d.awq!=null&&S.awedit){const it=S.awedit.items[+d.awq];it.qty=Math.max(1,it.qty+ +d.d);awRedraw();return}
  if(d.awrm!=null&&S.awedit){S.awedit.items.splice(+d.awrm,1);awRedraw();return}
  if(d.awsave!=null&&S.awedit){
    const e2=S.awedit, err=document.getElementById("awerr"), fail=m=>{err.textContent=m;err.hidden=false};
    const nr=e2.nr||String(awNext()), date=document.getElementById("aw-date").value||today();
    const items=e2.items.filter(i=>String(i.type).trim()).map(i=>({type:String(i.type).trim(),qty:+i.qty||1,price:String(i.price??"").trim()===""?0:(+String(i.price).replace(",",".")||0)}));
    if(!items.length)return fail("Lägg till minst en artikel.");
    const c=S.orders.find(x=>x.id===e2.companyId)||{};
    saveOrder({...e2,id:e2.id||("aw-"+nr),nr,date,items,note:document.getElementById("aw-note").value.trim(),companyName:c.name||"",createdAt:e2.createdAt||Date.now()});
    S.coId=e2.companyId;closeSheet();toast("Ordern sparad");return}
  if(d.awstatus){const o=S.orders.find(x=>x.id===S.awId);if(o){saveOrder({...o,status:d.awstatus});renderSheet(true)}return}
  if(d.awpdf){const o=S.orders.find(x=>x.id===d.awpdf);if(o)awOrderPdf(o);return}
  if(d.awdelask!=null){S.awDelAsk=true;renderSheet(true);return}
  if(d.awdelno!=null){S.awDelAsk=false;renderSheet(true);return}
  if(d.awdel){deleteOrder(d.awdel);S.awDelAsk=false;closeSheet();toast("Ordern borttagen");return}
  // fakturaunderlag
  if(d.invoice){S.inv=null;openSheet("invoice",{coId:d.invoice});return}
  if(d.invmode){S.inv.mode=d.invmode;S.inv.skip=[];renderSheet(true);return}
  if(d.invtype){S.inv.type=d.invtype;S.inv.idx=0;S.inv.skip=[];renderSheet(true);return}
  if(d.invmake!=null){const c=S.orders.find(x=>x.id===S.coId);if(c)invoicePdf(c);return}
  if(d.invmark!=null){const c=S.orders.find(x=>x.id===S.coId);if(c){const os=invOrders(c).filter(o=>o.status!=="fakturerad");os.forEach(o=>saveOrder({...o,status:"fakturerad"}));toast(`${os.length} ordrar markerade som fakturerade`);renderSheet(true)}return}
  // kategorier
  if(d.awcats!=null){S.awcatsDraft=null;openSheet("awcats");return}
  if(d.catadd!=null){S.awcatsDraft.push({name:"",price:""});renderSheet(true);const ins=document.querySelectorAll("[data-catname]");ins[ins.length-1].focus();return}
  if(d.catrm!=null){S.awcatsDraft.splice(+d.catrm,1);renderSheet(true);return}
  if(d.catsave!=null){S.settings.awCats=S.awcatsDraft.map(k=>({name:String(k.name).trim(),price:String(k.price).trim()===""?"":+String(k.price).replace(",",".")||0})).filter(k=>k.name);saveSettings();closeSheet();toast("Kategorierna sparade");return}
});

    :`<div class="empty" style="grid-column:1/-1">${f==="inne"?"Inga plagg inne. Skriv märknumret ovan för att lägga till.":f==="klar"?"Inga klara plagg.":"Inga levererade plagg än."}</div>`}</div>
  ${sel.length?`<div class="selbar">${S.pselDelAsk?`<span class="selmsg">Ta bort ${sel.length} plagg?</span><button class="btn ghost small" data-pdelno>Avbryt</button><button class="btn danger small" data-pdelyes>Ta bort</button>`
    :`<button class="btn danger small" data-pdel aria-label="Ta bort">${ICON.trash}</button><span class="selmsg">${sel.length} vald${sel.length>1?"a":""}</span>${sel.length===1?`<button class="btn ghost small" data-pnote="${esc(sel[0])}" aria-label="Anteckning">${ICON.edit}</button>`:""}${actions}<button class="btn ghost small" data-pselclear aria-label="Avmarkera">✕</button>`}</div>`:""}
  </div>`;
}
function plFormHtml(p){
  const f=(id,l,v,extra="")=>`<div class="field"><label class="label" for="${id}">${l}</label><input id="${id}" value="${esc(v||"")}" ${extra}></div>`;
  return `<div class="stack" data-form="pl">
    <h2 style="margin:0">${p.id?"Ändra inlämningsställe":"Nytt inlämningsställe"}</h2>
    ${f("pl-name","Namn",p.name,'autocapitalize="words" placeholder="T.ex. ICA Perstorp"')}
    ${f("pl-address","Adress",p.address)}
    <div class="grid2">${f("pl-contact","Kontaktperson",p.contact,'autocapitalize="words"')}${f("pl-phone","Telefon",p.phone,'type="tel" inputmode="tel"')}</div>
    ${f("pl-note","Anteckning",p.note)}
    <p id="plformerr" class="notice" hidden></p>
    <button class="btn primary" data-plsave>Spara</button>
    <button class="btn ghost small" data-sheetclose>Avbryt</button></div>`;
}
function renderPlSheet(host,force){
  if(S.mode==="pinote"){const i=S.orders.find(x=>x.id===S.piId);if(!i){closeSheet();return true}
    if(!force&&host.querySelector('[data-form="pinote"]'))return true;
    host.innerHTML=`<div class="sheet" data-awbackdrop><div class="panel" role="dialog"><div class="stack" data-form="pinote">
      <h2 style="margin:0">Plagg ${esc(i.nr)}</h2>
      <div class="field"><label class="label" for="pi-note">Anteckning</label><input id="pi-note" value="${esc(i.note||"")}" placeholder="T.ex. skjorta"></div>
      <button class="btn primary" data-pinotesave>Spara</button><button class="btn ghost small" data-sheetclose>Avbryt</button></div></div></div>`;
    setTimeout(()=>{const el=document.getElementById("pi-note");if(el)el.focus()},50);return true}
  if(S.mode!=="plform")return false;
  if(!force&&host.querySelector('[data-form="pl"]'))return true;
  const had=!!host.querySelector(".sheet");
  host.innerHTML=`<div class="sheet${had?" noanim":""}" data-awbackdrop><div class="panel" role="dialog">${plFormHtml(S.pledit||{})}</div></div>`;
  return true;
}
function plAdd(){
  const inp=document.getElementById("pl-nr"); if(!inp)return;
  const nr=inp.value.trim();
  if(!/^\d+$/.test(nr)){S.plMsg="Skriv bara siffror.";S.plDraft=nr;render();focusPl();return}
  const dup=plItems(S.plId).find(i=>i.nr===nr&&i.status!=="levererad");
  if(dup){S.plMsg=`${nr} finns redan under ${PL_ST[dup.status]}.`;S.plDraft="";render();focusPl();return}
  const note=(document.getElementById("pl-note")||{value:""}).value.trim();
  saveOrder({id:"pi-"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),kind:"pi",placeId:S.plId,nr,note,status:"inne",inDate:today(),createdAt:Date.now()});
  S.plMsg=`${nr}${note?" ("+note+")":""} tillagd under Inne.`;S.plDraft="";S.plNoteDraft="";S.plf="inne";render();focusPl();
}
function focusPl(){const i=document.getElementById("pl-nr");if(i){i.focus();}}
document.addEventListener("submit",e=>{if(e.target.matches("[data-pladdform]")){e.preventDefault();e.stopImmediatePropagation();plAdd()}},true);
document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const d=t.dataset;
  if(d.view){S.plId=null;S.psel=[]}
  if(d.plnew!=null){openSheet("plform",{pledit:{}});return}
  if(d.plopen){S.plId=d.plopen;S.plf="inne";S.psel=[];S.plMsg="";S.plDelAsk=false;render();scrollTo(0,0);return}
  if(d.plclose!=null){S.plId=null;S.psel=[];render();scrollTo(0,0);return}
  if(d.pledit){openSheet("plform",{pledit:JSON.parse(JSON.stringify(S.orders.find(x=>x.id===d.pledit)||{}))});return}
  if(d.plsave!=null){
    const v=id=>document.getElementById(id).value.trim(), err=document.getElementById("plformerr");
    const name=v("pl-name");if(!name){err.textContent="Skriv inlämningsställets namn.";err.hidden=false;return}
    const old=S.pledit||{}, id=old.id||("pl-"+Date.now().toString(36));
    saveOrder({...old,id,kind:"pl",name,address:v("pl-address"),contact:v("pl-contact"),phone:v("pl-phone"),note:v("pl-note"),createdAt:old.createdAt||Date.now()});
    S.plId=id;S.pledit=null;closeSheet();toast("Inlämningsstället sparat");return}
  if(d.pldelask!=null){S.plDelAsk=true;render();return}
  if(d.pldelno!=null){S.plDelAsk=false;render();return}
  if(d.pldel){deleteOrder(d.pldel);S.plId=null;S.plDelAsk=false;render();toast("Inlämningsstället borttaget");return}
  if(d.pnote){openSheet("pinote",{piId:d.pnote});return}
  if(d.pinotesave!=null){const i=S.orders.find(x=>x.id===S.piId);if(i)saveOrder({...i,note:document.getElementById("pi-note").value.trim()});S.psel=[];closeSheet();toast("Anteckningen sparad");return}
  if(d.plf){S.plf=d.plf;S.psel=[];S.pselDelAsk=false;render();return}
  if(d.plall!=null){const shown=plItems(S.plId).filter(i=>i.status===(S.plf||"inne"));S.psel=S.psel.length===shown.length?[]:shown.map(i=>i.id);render();return}
  if(d.pselclear!=null){S.psel=[];S.pselDelAsk=false;render();return}
  if(d.pdel!=null){S.pselDelAsk=true;render();return}
  if(d.pdelno!=null){S.pselDelAsk=false;render();return}
  if(d.pdelyes!=null){const n=S.psel.length;S.psel.forEach(id=>deleteOrder(id));S.psel=[];S.pselDelAsk=false;render();toast(`${n} plagg borttagna`);return}
  if(d.plset){const st=d.plset, now=today();const its=S.orders.filter(o=>S.psel.includes(o.id));
    its.forEach(o=>{const n={...o,status:st};if(st==="klar")n.readyDate=n.readyDate&&o.status==="levererad"?n.readyDate:now;if(st==="levererad")n.deliveredDate=now;if(st==="inne"){delete n.readyDate}saveOrder(n)});
    S.psel=[];render();toast(`${its.length} plagg flyttade till ${PL_ST[st]}`);return}
});
document.addEventListener("input",e=>{if(e.target.id==="pl-nr"){S.plDraft=e.target.value}if(e.target.id==="pl-note"){S.plNoteDraft=e.target.value}});
document.addEventListener("change",e=>{const t=e.target,d=t.dataset;
  if(d.psel){S.psel=S.psel||[];if(t.checked){if(!S.psel.includes(d.psel))S.psel.push(d.psel)}else S.psel=S.psel.filter(x=>x!==d.psel);S.pselDelAsk=false;render()}});

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a,[data-backdrop]");if(!t)return;
  const d=t.dataset;
  if(d.view){S.view=d.view;S.open=null;S.catDraft=null;document.getElementById("main").innerHTML="";render();scrollTo(0,0);return}
  if(d.add!=null){const g=d.add;draft.items.push({type:g,qty:1,price:g&&S.settings.prices?.[g]!=null&&S.settings.prices[g]!==""?+S.settings.prices[g]:""});renderItems();if(!g){const ins=document.querySelectorAll("[data-type]");ins[ins.length-1].focus()}return}
  if(d.q!=null){const it=draft.items[+d.q];it.qty=Math.max(1,it.qty+ +d.d);renderItems();return}
  if(d.rm!=null){draft.items.splice(+d.rm,1);renderItems();return}
  if(d.open){S.open=d.open;S.mode="detail";S.confirmDel=false;renderSheet();return}
  if(d.backdrop!=null&&e.target===t){S.open=null;renderSheet();return}
  if(d.close!=null){S.open=null;renderSheet();return}
  if(d.mode){S.mode=d.mode;renderSheet();return}
  if(d.copynum){copyText(d.copynum,"Numret kopierat");return}
  if(d.copyin){const oo=S.orders.find(x=>x.id===d.copyin);if(oo)copyText(msgIn(oo),"Texten kopierad");return}
  const o=S.orders.find(x=>x.id===S.open);
  if(d.ready&&o){saveOrder({...o,status:"klar",readyAt:Date.now()});toast("Markerad som klar. Tryck Skicka i SMS-appen.");return}
  if(d.paid&&o){saveOrder({...o,status:"hamtad",pickedAt:Date.now()});S.mode="review";renderSheet();toast(`${o.nr} betald och hämtad`);return}
  if(d.reviewsent){const oo=S.orders.find(x=>x.id===d.reviewsent);if(oo)saveOrder({...oo,reviewSent:Date.now()});setTimeout(()=>{S.open=null;renderSheet()},800);return}
  if(d.startedit&&o){S.edit=JSON.parse(JSON.stringify(o));S.mode="edit";renderSheet(true);document.querySelector(".panel").scrollTop=0;return}
  if(d.ecancel!=null){S.edit=null;S.mode="detail";renderSheet(true);return}
  if(d.eadd!=null&&S.edit){const g=d.eadd;S.edit.items.push({type:g,qty:1,price:g&&S.settings.prices?.[g]!=null&&S.settings.prices[g]!==""?+S.settings.prices[g]:""});redrawEditItems();if(!g){const ins=document.querySelectorAll("[data-etype]");ins[ins.length-1].focus()}return}
  if(d.eq!=null&&S.edit){const it=S.edit.items[+d.eq];it.qty=Math.max(1,it.qty+ +d.d);redrawEditItems();return}
  if(d.erm!=null&&S.edit){S.edit.items.splice(+d.erm,1);redrawEditItems();return}
  if(d.esave!=null&&S.edit){
    const e=S.edit, err=document.getElementById("editerr"); const fail=m=>{err.textContent=m;err.hidden=false};
    if(!e.name.trim())return fail("Skriv kundens namn.");
    if(normPhone(e.phone).replace(/\D/g,"").length<8)return fail("Skriv ett giltigt mobilnummer.");
    const items=e.items.filter(i=>String(i.type).trim()).map(i=>({type:String(i.type).trim(),qty:+i.qty||1,price:+String(i.price).replace(",",".")||0}));
    if(!items.length)return fail("Lägg till minst ett plagg.");
    const nr=String(e.nr||"").trim();if(!/^\d+$/.test(nr))return fail("Kvittonumret får bara innehålla siffror.");
    const cur=S.orders.find(x=>x.id===e.id)||e;
    if(nr!==cur.id&&realOrders().some(x=>x.id===nr))return fail(`Kvittonummer ${nr} används redan.`);
    const upd={...cur,id:nr,nr,inDate:e.inDate||cur.inDate,name:e.name.trim(),phone:e.phone.trim(),items,paket:!!e.paket,galge:!!e.galge,note:(e.note||"").trim()};
    if(nr!==cur.id)deleteOrder(cur.id);
    saveOrder(upd);S.open=nr;
    S.edit=null;S.mode="detail";renderSheet(true);toast("Ändringarna sparade");return}
  if(d.gadd!=null){S.catDraft.push({name:"",price:""});render();const ins=document.querySelectorAll("[data-gname]");ins[ins.length-1].focus();return}
  if(d.grm!=null){S.catDraft.splice(+d.grm,1);render();return}
  if(d.gup!=null||d.gdown!=null){const i=+(d.gup??d.gdown),j=d.gup!=null?i-1:i+1;const c=S.catDraft;if(j>=0&&j<c.length){[c[i],c[j]]=[c[j],c[i]];render()}return}
  if(d.gback!=null){S.catDraft=null;S.view="ny";document.getElementById("main").innerHTML="";render();scrollTo(0,0);return}
  if(d.smsp){local.smsPrice=d.smsp==="1";lsSave();const oo=S.orders.find(x=>x.id===S.open);if(S.mode==="sent"&&oo)renderSentSheet(oo);else renderSheet();return}
  if(d.unready&&o){const n={...o,status:"inne"};delete n.readyAt;saveOrder(n);toast(`${o.nr} flyttad tillbaka till Inne`);return}
  if(d.undo&&o){const n={...o,status:"klar"};delete n.paidWith;delete n.pickedAt;saveOrder(n);return}
  if(d.del!=null){S.confirmDel=true;renderSheet();return}
  if(d.delno!=null){S.confirmDel=false;renderSheet();return}
  if(d.delyes){deleteOrder(d.delyes);S.open=null;S.confirmDel=false;renderSheet();toast("Borttagen");return}
  if(d.copy&&o){const txt=d.copy==="in"?msgIn(o):msgReady(o);navigator.clipboard?.writeText(txt).then(()=>toast("Text kopierad")).catch(()=>{const m=t.parentElement.querySelector(".msg");const r=document.createRange();r.selectNodeContents(m);getSelection().removeAllRanges();getSelection().addRange(r);toast("Markerad – kopiera manuellt")});return}
  if(t.id==="backup"||t.id==="backup2"){backup();return}
  if(t.id==="csv"){exportCsv();return}
  if(t.id==="logout"){logout();return}
  if(t.id==="saveprices"){const rows=(S.catDraft||[]).map(k=>({name:String(k.name).trim(),price:String(k.price??"").replace(",",".").trim()})).filter(k=>k.name);
    S.settings.cats=rows.map(k=>k.name);S.settings.prices={};rows.forEach(k=>{if(k.price!=="")S.settings.prices[k.name]=+k.price||0});S.catDraft=null;const sn=parseInt(document.getElementById("startnr").value,10);if(sn>0)S.settings.start=sn;saveSettings();toast("Sparat");S.view="ny";document.getElementById("main").innerHTML="";render();scrollTo(0,0);return}
});
document.addEventListener("input",e=>{
  const t=e.target,d=t.dataset;
  if(S.edit){
    if(d.etype!=null){S.edit.items[+d.etype].type=t.value;return}
    if(d.eprice!=null){S.edit.items[+d.eprice].price=t.value.replace(",",".");const s=document.getElementById("esum");if(s)s.textContent=kr(total(S.edit.items));return}
    if(t.id==="e-name"){S.edit.name=t.value;return}
    if(t.id==="e-nr"){S.edit.nr=t.value;return}
    if(t.id==="e-in"){S.edit.inDate=t.value;return}
    if(t.id==="e-phone"){S.edit.phone=t.value;return}
    if(t.id==="e-note"){S.edit.note=t.value;return}
    if(t.id==="e-paket"||t.id==="e-galge"){S.edit[t.id.slice(2)]=t.checked;return}
  }
  if(S.catDraft&&d.gname!=null){S.catDraft[+d.gname].name=t.value;return}
  if(S.catDraft&&d.gprice!=null){S.catDraft[+d.gprice].price=t.value;return}
  if(d.type!=null){draft.items[+d.type].type=t.value;return}
  if(d.price!=null){draft.items[+d.price].price=t.value.replace(",",".");updateSum();return}
  const map={"f-nr":"nr","f-name":"name","f-phone":"phone","f-in":"inDate","f-ready":"readyDate","f-note":"note"};
  if(map[t.id]){draft[map[t.id]]=t.value;if(t.id==="f-in")draft.inManual=true;return}
  if(t.id==="f-paket"||t.id==="f-galge"){draft[t.id.slice(2)]=t.checked;return}
  if(t.id==="q"){S.q=t.value;const pos=t.selectionStart;render();const q=document.getElementById("q");q.focus();try{q.setSelectionRange(pos,pos)}catch(_){}}
});
document.addEventListener("change",e=>{if(e.target.id==="restore"&&e.target.files[0]){restoreFile(e.target.files[0]);e.target.value=""}});
document.addEventListener("submit",async e=>{
  e.preventDefault();
  const err=document.getElementById("formerr");const fail=m=>{err.textContent=m;err.hidden=false};
  err.hidden=true;
  const nr=String(draft.nr||suggestNr()).trim();
  if(!/^\d+$/.test(nr))return fail("Kvittonumret får bara innehålla siffror.");
  if(!draft.name.trim())return fail("Skriv kundens namn.");
  if(normPhone(draft.phone).replace(/\D/g,"").length<8)return fail("Skriv ett mobilnummer så att SMS kan skickas.");
  const items=draft.items.filter(i=>i.type.trim()).map(i=>({type:i.type.trim(),qty:+i.qty||1,price:+i.price||0}));
  if(!items.length)return fail("Lägg till minst ett plagg.");
  const clash=S.orders.find(o=>o.id===nr&&o.status!=="hamtad");
  if(clash)return fail(`Nummer ${nr} används redan av ${clash.name} som inte har hämtat än.`);
  const o={id:nr,nr,name:draft.name.trim(),phone:draft.phone.trim(),items,inDate:draft.inDate,readyDate:"",note:draft.note.trim(),paket:!!draft.paket,galge:!!draft.galge,status:"inne",createdAt:Date.now()};
  await saveOrder(o);
  draft=draftEmpty();
  document.getElementById("main").innerHTML="";S.open=nr;S.mode="sent";render();
  renderSentSheet(o);
});
function renderSentSheet(o){
  document.getElementById("sheet").innerHTML=`<div class="sheet" data-backdrop><div class="panel" role="dialog" aria-label="Sparad">
    <div class="tagcard"><span class="who">${esc(o.name)}</span><span class="no">${esc(o.nr)}</span><span class="sub">Sparad · ${kr(total(o.items))}</span></div>
    <p class="hint" style="margin:12px 2px 0">Skicka kvittot till kunden. SMS-appen öppnas med texten ifylld, tryck Skicka där.</p>
    ${smsToggle()}
    <div class="msg">${esc(msgIn(o))}</div>
    <div class="stack" style="margin-top:14px">
      <a class="btn primary" href="${smsHref(o.phone,msgIn(o))}" data-sentok>Skicka SMS till ${esc(fmtPhone(o.phone))}</a>
      <p class="hint">Öppnas inte Meddelanden? Kopiera och klistra in själv.</p>
      <div class="row"><button class="btn ghost small" data-copynum="${esc(normPhone(o.phone))}">Kopiera nummer</button><button class="btn ghost small" data-copyin="${esc(o.id)}">Kopiera text</button></div>
      <button class="btn ghost small" data-close>Klar, ny inlämning</button></div></div></div>`;
}
document.addEventListener("click",e=>{if(e.target.closest("[data-sentok]")){setTimeout(()=>{S.open=null;renderSheet()},800)}});

function refreshToday(){ if(!draft.inManual&&draft.inDate!==today()){draft.inDate=today();const el=document.getElementById("f-in");if(el)el.value=draft.inDate} }
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")refreshToday()});
window.addEventListener("focus",refreshToday);
setInterval(refreshToday,60000);
initDb();
